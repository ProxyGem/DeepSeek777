<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek777 · AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0e0e11;
            --sidebar-bg: #16161a;
            --card-bg: #1e1e24;
            --input-bg: #222228;
            --border-color: #2e2e36;
            --text-primary: #e6e6e8;
            --text-secondary: #9e9ea8;
            --accent-blue: #4d6bfe;
            --accent-blue-hover: #3b57e2;
            --accent-pink: #ff6b9d;
            --accent-pink-hover: #e55a8a;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 10px;
            user-select: none;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px 12px 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .brand-logo {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #4d6bfe, #8c52ff);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .header-icons {
            display: flex;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .header-icons i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .header-icons i:hover {
            color: var(--text-primary);
        }

        .new-chat-btn {
            background-color: #282830;
            color: var(--text-primary);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 16px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #32323c;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 4px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a32;
            border-radius: 3px;
        }

        .history-section-label {
            font-size: 11px;
            color: var(--text-secondary);
            padding: 12px 8px 4px 8px;
            font-weight: 600;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #c4c4cd;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
        }

        .history-item:hover {
            background-color: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .history-item.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .delete-chat-btn {
            display: none;
            color: var(--text-secondary);
            font-size: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .history-item:hover .delete-chat-btn {
            display: block;
        }

        .delete-chat-btn:hover {
            color: #ff5555;
        }

        .sidebar-user {
            margin-top: auto;
            padding: 10px 8px 4px 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            background-color: #5d4037;
            color: #ffcc80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .user-name {
            color: var(--text-primary);
            font-size: 13px;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-main);
            height: 100vh;
            min-width: 0;
        }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            margin-bottom: 40px;
        }

        .welcome-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fff;
        }

        .welcome-title i {
            color: var(--accent-blue);
            font-size: 24px;
        }

        .model-pills {
            display: flex;
            background-color: #19191e;
            padding: 4px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 28px;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .pill-btn.active {
            background-color: #2b2e3a;
            color: #fff;
        }

        .pill-btn.femboy-pill.active {
            background-color: rgba(255, 107, 157, 0.25);
            color: #ff6b9d;
            border: 1px solid #ff6b9d;
        }

        .pill-btn.mecha-pill.active {
            background-color: rgba(77, 107, 254, 0.25);
            color: #82a0ff;
            border: 1px solid #4d6bfe;
        }

        .chat-input-wrapper {
            width: 100%;
            max-width: 720px;
            background-color: #1a1a20;
            border: 1px solid #2a2a34;
            border-radius: 16px;
            padding: 14px 16px 10px 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .chat-input-wrapper:focus-within {
            border-color: #3b3f52;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            resize: none;
            min-height: 40px;
            max-height: 200px;
            line-height: 1.5;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #636370;
        }

        .input-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tool-toggles {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid #2e2e38;
            color: #8c8c9a;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tool-btn.active {
            background-color: rgba(77, 107, 254, 0.15);
            border-color: var(--accent-blue);
            color: #82a0ff;
        }

        .tool-btn.disabled-tool {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-icon {
            color: #6a6a78;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .action-icon:hover {
            color: var(--text-primary);
        }

        .send-submit-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #313545;
            color: #7d8090;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-submit-btn.active-send {
            background-color: var(--accent-blue);
            color: #fff;
        }

        .send-submit-btn:hover {
            opacity: 0.8;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .message-row {
            display: flex;
            gap: 14px;
            width: 100%;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-user .message-avatar {
            background-color: #383842;
            color: #fff;
        }

        .msg-assistant .message-avatar {
            background: linear-gradient(135deg, #4d6bfe, #8c52ff);
            color: #fff;
        }

        .msg-assistant.femboy-msg .message-avatar {
            background: linear-gradient(135deg, #ff6b9d, #ff3c7e);
        }

        .msg-assistant.mecha-msg .message-avatar {
            background: linear-gradient(135deg, #4d6bfe, #00d4ff);
        }

        .message-body {
            flex: 1;
            font-size: 14.5px;
            line-height: 1.6;
            color: #dbdbe0;
            overflow-x: auto;
            min-width: 0;
            word-wrap: break-word;
        }

        .message-body p {
            margin-bottom: 10px;
        }

        .message-body p:last-child {
            margin-bottom: 0;
        }

        .msg-user .message-body {
            background-color: #1e1e26;
            padding: 10px 16px;
            border-radius: 12px;
            max-width: 85%;
            margin-left: auto;
        }

        .code-block-wrapper {
            background-color: #141418;
            border: 1px solid #2a2a32;
            border-radius: 8px;
            margin: 12px 0;
            overflow: hidden;
        }

        .code-header {
            background-color: #1a1a20;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a32;
            font-size: 12px;
            color: var(--text-secondary);
            flex-wrap: wrap;
            gap: 8px;
        }

        .code-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .code-btn {
            background: transparent;
            border: 1px solid #32323e;
            color: #a0a0b0;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .code-btn:hover {
            background-color: #2b2b36;
            color: #fff;
        }

        pre {
            padding: 12px;
            overflow-x: auto;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 13px;
            color: #e2e2e8;
            background: #141418;
            border-radius: 0 0 8px 8px;
            margin: 0;
        }

        code {
            font-family: inherit;
        }

        .generated-image-box {
            margin: 12px 0;
        }

        .generated-image-box img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            width: 85vw;
            height: 85vh;
            background-color: #16161a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 12px 16px;
            background-color: #1e1e24;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .close-modal-btn:hover {
            color: #fff;
        }

        .modal-body {
            flex: 1;
            background: #fff;
            min-height: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-message {
            color: #ff5555;
            background: rgba(255, 85, 85, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 85, 85, 0.2);
            font-size: 13px;
        }

        .input-container-bottom {
            padding: 10px 20px 20px 20px;
            flex-shrink: 0;
        }

        .input-container-bottom .chat-input-wrapper {
            max-width: 800px;
        }

        .image-preview {
            max-width: 300px;
            max-height: 200px;
            border-radius: 8px;
            margin: 8px 0;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .image-preview:hover {
            transform: scale(1.02);
        }

        .image-attachment {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e1e26;
            border-radius: 8px;
            padding: 4px 10px 4px 4px;
            border: 1px solid var(--border-color);
        }

        .image-attachment img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 4px;
        }

        .image-attachment .remove-attach {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .image-attachment .remove-attach:hover {
            color: #ff5555;
        }

        .image-picker-wrapper {
            position: relative;
            display: inline-block;
        }
        .image-picker-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            left: 0;
            top: 0;
        }

        .femboy-badge {
            background: #ff6b9d;
            color: #fff;
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            font-weight: 700;
        }

        .mecha-badge {
            background: #4d6bfe;
            color: #fff;
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 8px 6px;
            }

            .sidebar .brand span,
            .sidebar .user-name,
            .sidebar .history-item span {
                display: none;
            }

            .sidebar .new-chat-btn span {
                display: none;
            }

            .sidebar .new-chat-btn {
                padding: 8px;
                justify-content: center;
            }

            .history-item {
                justify-content: center;
                padding: 8px;
            }

            .history-item .delete-chat-btn {
                display: none !important;
            }

            .sidebar-user .user-info {
                justify-content: center;
            }

            .sidebar-header .header-icons i:first-child {
                display: none;
            }

            .model-pills {
                flex-direction: column;
                gap: 4px;
                padding: 6px;
            }

            .pill-btn {
                justify-content: center;
                padding: 8px 12px;
            }

            .messages-container {
                padding: 12px;
            }

            .welcome-title {
                font-size: 20px;
            }

            .chat-input-wrapper {
                padding: 10px 12px 8px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-logo">D</div>
                <span>DeepSeek777</span>
            </div>
            <div class="header-icons">
                <i class="fa-regular fa-message"></i>
                <i class="fa-regular fa-circle-question"></i>
            </div>
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> <span>New chat</span>
        </button>

        <div class="chat-history" id="chatHistoryList"></div>

        <div class="sidebar-user">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div class="user-name">Пользователь</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <i class="fa-solid fa-key" onclick="saveApiKey()" title="Сохранить API ключ" style="cursor:pointer; color: var(--text-secondary);"></i>
            </div>
        </div>
    </div>

    <div class="main-chat" id="mainChatArea">

        <div class="welcome-container" id="welcomeView">
            <div class="welcome-title">
                <i class="fa-solid fa-robot"></i> DeepSeek777
            </div>

            <div class="model-pills">
                <button class="pill-btn active" id="btnDeepseek" onclick="selectModel('deepseek')">
                    <i class="fa-solid fa-bolt"></i> DeepSeek777
                </button>
                <button class="pill-btn" id="btnGptMini" onclick="selectModel('gptmini')">
                    <i class="fa-solid fa-gem"></i> GPT Кент
                </button>
                <button class="pill-btn femboy-pill" id="btnFemboy" onclick="selectModel('femboy')">
                    <i class="fa-solid fa-heart" style="color: #ff6b9d;"></i> Femboy36k
                    <span class="femboy-badge">NEW</span>
                </button>
                <button class="pill-btn mecha-pill" id="btnMecha" onclick="selectModel('mecha')">
                    <i class="fa-solid fa-skull" style="color: #4d6bfe;"></i> Mecha
                    <span class="mecha-badge">Misha25k</span>
                </button>
            </div>

            <div class="chat-input-wrapper">
                <textarea id="promptInput" placeholder="Message DeepSeek777" oninput="handleInput(this)" onkeydown="checkSubmit(event)"></textarea>
                <div class="input-toolbar">
                    <div class="tool-toggles">
                        <button class="tool-btn" id="deepthinkBtn" onclick="toggleTool('deepthink')">
                            <i class="fa-solid fa-atom"></i> DeepThink
                        </button>
                        <button class="tool-btn" id="searchBtn" onclick="toggleTool('search')">
                            <i class="fa-solid fa-globe"></i> Search
                        </button>
                        <button class="tool-btn" id="imageGenBtn" onclick="toggleTool('image')">
                            <i class="fa-solid fa-image"></i> Image Gen
                        </button>
                        <div class="image-picker-wrapper">
                            <button class="tool-btn" onclick="document.getElementById('imageFileInput').click()">
                                <i class="fa-solid fa-paperclip"></i> Attach
                            </button>
                            <input type="file" id="imageFileInput" accept="image/*" onchange="handleImageAttach(event)">
                        </div>
                    </div>
                    <div class="input-actions">
                        <button class="send-submit-btn" id="sendBtn" onclick="sendUserMessage()">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
                <div id="attachmentPreview" style="display: none; margin-top: 6px;"></div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer" style="display: none;"></div>

        <div class="input-container-bottom" id="bottomInputContainer" style="display: none;">
            <div class="chat-input-wrapper">
                <textarea id="promptInputBottom" placeholder="Message GEM..." oninput="handleInput(this)" onkeydown="checkSubmit(event)"></textarea>
                <div class="input-toolbar">
                    <div class="tool-toggles">
                        <button class="tool-btn" id="deepthinkBtn2" onclick="toggleTool('deepthink')">
                            <i class="fa-solid fa-atom"></i> DeepThink
                        </button>
                        <button class="tool-btn" id="searchBtn2" onclick="toggleTool('search')">
                            <i class="fa-solid fa-globe"></i> Search
                        </button>
                        <button class="tool-btn" id="imageGenBtn2" onclick="toggleTool('image')">
                            <i class="fa-solid fa-image"></i> Image Gen
                        </button>
                        <div class="image-picker-wrapper">
                            <button class="tool-btn" onclick="document.getElementById('imageFileInputBottom').click()">
                                <i class="fa-solid fa-paperclip"></i> Attach
                            </button>
                            <input type="file" id="imageFileInputBottom" accept="image/*" onchange="handleImageAttach(event)">
                        </div>
                    </div>
                    <div class="input-actions">
                        <button class="send-submit-btn" id="sendBtn2" onclick="sendUserMessage()">

        // ===== MARKED RENDERER =====
        const renderer = new marked.Renderer();
        renderer.code = function(codeArg, langArg) {
            let codeText = typeof codeArg === 'object' ? (codeArg.text || '') : (codeArg || '');
            let language = typeof codeArg === 'object' ? (codeArg.lang || 'text') : (langArg || 'text');

            const isHTML = language.toLowerCase() === 'html' ||
                (typeof codeText === 'string' && (codeText.includes('<html') || codeText.includes('<!DOCTYPE')));

            return `
            <div class="code-block-wrapper">
                <div class="code-header">
                    <span>${escapeHtml(language)}</span>
                    <div class="code-actions">
                        ${isHTML ? `<button class="code-btn" onclick="previewCode(this)"><i class="fa-solid fa-play"></i> Preview</button>` : ''}
                        <button class="code-btn" onclick="saveCodeToFile(this, '${escapeHtml(language)}')"><i class="fa-solid fa-download"></i> Save</button>
                        <button class="code-btn" onclick="copyCode(this)"><i class="fa-solid fa-copy"></i> Copy</button>
                    </div>
                </div>
                <pre><code>${escapeHtml(String(codeText))}</code></pre>
            </div>`;
        };

        marked.setOptions({ renderer: renderer });

        // ===== UTILITY FUNCTIONS =====
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ===== IMAGE ATTACH =====
        function handleImageAttach(event) {

                preview.style.display = 'block';
                previewBottom.innerHTML = html;
                previewBottom.style.display = 'block';

                event.target.value = '';
                handleInput(document.getElementById('promptInput'));

            const sendBtn1 = document.getElementById('sendBtn');
            const sendBtn2 = document.getElementById('sendBtn2');

            const hasText = el.value.trim().length > 0 || !!attachedImage;
            if (sendBtn1) sendBtn1.classList.toggle('active-send', hasText);
            if (sendBtn2) sendBtn2.classList.toggle('active-send', hasText);

        // ===== CHAT MANAGEMENT =====
        function startNewChat() {
            currentChatId = null;
            document.getElementById('welcomeView').style.display = 'flex';
            document.getElementById('messagesContainer').style.display = 'none';
            document.getElementById('bottomInputContainer').style.display = 'none';

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('welcomeView').style.display = 'none';
            document.getElementById('messagesContainer').style.display = 'flex';
            document.getElementById('bottomInputContainer').style.display = 'block';

            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            chat.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.content);
            });

            renderChatHistory();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if (!confirm('Удалить этот диалог?')) return;

            chats = chats.filter(c => c.id !== id);
            localStorage.setItem('gem_chats', JSON.stringify(chats));
            if (currentChatId === id) {
                startNewChat();
            } else {
                renderChatHistory();
            }
        }

        function renderChatHistory() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';

            if (chats.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.cssText = 'color: var(--text-secondary); font-size: 13px; padding: 20px 10px; text-align: center;';
                emptyMsg.textContent = 'No chats yet';
                list.appendChild(emptyMsg);
                return;
            }

            const today = [];
            const yesterday = [];
            const older = [];
            const now = new Date();

            chats.forEach(chat => {
                const chatDate = new Date(chat.timestamp);
                const diffDays = Math.floor((now - chatDate) / (1000 * 60 * 60 * 24));

                if (diffDays === 0) today.push(chat);
                else if (diffDays === 1) yesterday.push(chat);
                else older.push(chat);
            });

            const renderGroup = (label, items) => {
                if (items.length === 0) return;
                const groupLabel = document.createElement('div');
                groupLabel.className = 'history-section-label';
                groupLabel.innerText = label;
                list.appendChild(groupLabel);

                items.forEach(c => {
                    const item = document.createElement('div');
                    item.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
                    item.onclick = () => loadChat(c.id);

                    const titleSpan = document.createElement('span');
                    titleSpan.textContent = c.title || 'New chat';

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-chat-btn';
                    deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                    deleteBtn.onclick = (e) => deleteChat(e, c.id);

                    item.appendChild(titleSpan);
                    item.appendChild(deleteBtn);
                    list.appendChild(item);
                });
            };

            renderGroup('Today', today);
            renderGroup('Yesterday', yesterday);
            renderGroup('7 Days', older);
        }

        // ===== MESSAGE RENDERING =====
        function appendMessageToDOM(role, text) {
            const container = document.getElementById('messagesContainer');
            const row = document.createElement('div');
            row.className = `message-row msg-${role}`;

            const isFemboy = isFemboyMode();
            const isMecha = isMechaMode();

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            if (role === 'user') {
                avatar.innerText = '👤';
            } else {
                if (isFemboy) {
                    avatar.innerText = '🌸';
                    row.classList.add('femboy-msg');
                } else if (isMecha) {
                    avatar.innerText = '💀';
                    row.classList.add('mecha-msg');
                } else {
                    avatar.innerText = '🤖';
                }
            }

            const body = document.createElement('div');
            body.className = 'message-body';

            if (role === 'user') {
                if (text.startsWith('data:image')) {
                    body.innerHTML = `<img src="${text}" class="image-preview" onclick="window.open('${text}','_blank')" />`;
                } else {
                    body.innerHTML = `<p>${escapeHtml(text)}</p>`;
                }
            } else {
                try {
                    body.innerHTML = marked.parse(text);
                } catch (e) {
                    body.textContent = text;
                }
            }

            row.appendChild(avatar);
            row.appendChild(body);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;

            return body;
        }

            row.appendChild(avatar);
            row.appendChild(body);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();

        // ===== SEND MESSAGE =====

            }

                });

                        `https://image.pollinations.ai/prompt/${encodeURIComponent(messageText)}?width=800&height=600&nologo=true`;
                    const imgHtml =
                        `<p>Сгенерированное изображение:</p><div class="generated-image-box"><img src="${imgUrl}" alt="Generated Image" loading="lazy"/></div>`;
                    assistantEl.innerHTML = imgHtml;
                    currentChat.messages.push({ role: 'assistant', content: imgHtml });
                    localStorage.setItem('gem_chats', JSON.stringify(chats));
                    clearInputs();
                    return;
                } catch (err) {
                    assistantEl.innerHTML = `<div class="error-message">Ошибка генерации: ${escapeHtml(err.message)}</div>`;
                    clearInputs();
                    return;
                }
            }

            // ===== CHAT COMPLETION =====
            isProcessing = true;
            showTypingIndicator();

            try {
                const apiKey = getApiKey();
                if (!apiKey) {
                    throw new Error('API key not found. Please set your OpenRouter API key.');
                }

                const systemPrompt = getSystemPrompt();
                console.log('System prompt:', systemPrompt);

                let apiMessages = [
                    { role: 'system', content: systemPrompt }
                ];

                for (const m of currentChat.messages) {
                    if (m.role === 'user') {
                        if (m.content.startsWith('data:image')) {
                            apiMessages.push({
                                role: 'user',
                                content: '[Пользователь отправил изображение] ' + (messageText || 'Опиши это изображение.')
                            });
                        } else {
                            apiMessages.push({ role: 'user', content: m.content });
                        }
                    } else {
                        apiMessages.push({ role: 'assistant', content: m.content });
                    }
                }

                const modelToUse = getModelForAPI();
                console.log('Sending to API with model:', modelToUse);

                // Используем CORS прокси для обхода ограничений
                const proxyUrl = CORS_PROXY + encodeURIComponent(API_URL);

                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'DeepSeek777'
                    },
                    body: JSON.stringify({
                        model: modelToUse,
                        messages: apiMessages,
                        stream: true,
                        max_tokens: 4096
                    })
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    console.error('API Error:', errorData);
                    throw new Error(`API Error (${response.status}): ${errorData.substring(0, 200)}`);
                }

                removeTypingIndicator();

                const assistantEl = document.createElement('div');
                assistantEl.className = 'message-row msg-assistant';
                if (isFemboy) assistantEl.classList.add('femboy-msg');
                if (isMecha) assistantEl.classList.add('mecha-msg');

                const avatar = document.createElement('div');
                avatar.className = 'message-avatar';
                if (isFemboy) avatar.innerText = '🌸';
                else if (isMecha) avatar.innerText = '💀';
                else avatar.innerText = '🤖';

                const body = document.createElement('div');
                body.className = 'message-body';

                assistantEl.appendChild(avatar);
                assistantEl.appendChild(body);
                document.getElementById('messagesContainer').appendChild(assistantEl);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6).trim();
                            if (jsonStr === '[DONE]') continue;

                            try {
                                const parsed = JSON.parse(jsonStr);
                                const token = parsed.choices?.[0]?.delta?.content || '';
                                fullText += token;
                                try {
                                    body.innerHTML = marked.parse(fullText);
                                } catch (e) {
                                    body.textContent = fullText;
                                }
                                const container = document.getElementById('messagesContainer');
                                container.scrollTop = container.scrollHeight;
                            } catch (e) {
                                // skip
                            }
                        }
                    }
                }

                if (fullText.trim()) {
                    currentChat.messages.push({ role: 'assistant', content: fullText });
                    localStorage.setItem('gem_chats', JSON.stringify(chats));
                    console.log('Message saved, length:', fullText.length);
                } else {
                    console.warn('Empty response from API');
                }

            } catch (err) {
                console.error('Error:', err);
                removeTypingIndicator();
                const errorEl = appendMessageToDOM('assistant', '');
                errorEl.innerHTML = `<div class="error-message">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
            } finally {
                isProcessing = false;
                clearInputs();
            }
        }

        // ===== API KEY FUNCTIONS =====
        function saveApiKey() {
            const key = prompt('Введите ваш OpenRouter API ключ:');
            if (key && key.trim()) {
                localStorage.setItem('gem_api_key', key.trim());
                alert('✅ API Key сохранён!');
            } else if (key !== null) {
                alert('❌ Введите корректный API ключ.');
            }
        }

        // ===== CODE ACTIONS =====
        function copyCode(btn) {
            const code = btn.closest('.code-block-wrapper').querySelector('pre code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied`;
                setTimeout(() => btn.innerHTML = orig, 2000);
            }).catch(() => {
                const range = document.createRange();
                const pre = btn.closest('.code-block-wrapper').querySelector('pre');
                range.selectNode(pre);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                const orig = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied`;
                setTimeout(() => btn.innerHTML = orig, 2000);
            });
        }

        function saveCodeToFile(btn, language) {
            const code = btn.closest('.code-block-wrapper').querySelector('pre code').textContent;
            let ext = 'txt';
            const langMap = {
                'html': 'html',
                'javascript': 'js',
                'js': 'js',
                'css': 'css',
                'python': 'py',
                'py': 'py',
                'json': 'json',
                'xml': 'xml',
                'svg': 'svg',
                'sql': 'sql',
                'bash': 'sh',
                'shell': 'sh',
                'sh': 'sh',
                'typescript': 'ts',
                'ts': 'ts'
            };
            ext = langMap[language.toLowerCase()] || 'txt';

            try {
                const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `code_${Date.now()}.${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(a.href), 100);
            } catch (e) {
                alert('Error saving file: ' + e.message);
            }
        }

        function previewCode(btn) {
            const code = btn.closest('.code-block-wrapper').querySelector('pre code').textContent;
            const modal = document.getElementById('previewModal');
            const iframe = document.getElementById('previewIframe');

            modal.classList.add('active');
            iframe.srcdoc = code;
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.remove('active');
            document.getElementById('previewIframe').srcdoc = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePreviewModal();
            }
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                startNewChat();
            }
        });

        console.log('🚀 DeepSeek777 AI Assistant loaded. Use Ctrl+N for new chat.');
        console.log('🤖 Misha25k (Mecha) добавлен!');
        console.log('🌸 Femboy36k (Vova36k) добавлен! ❤️');
        console.log('📌 Image Gen доступен только для GPT Кент');
        console.log('🌐 CORS Proxy enabled for GitHub Pages compatibility');
    </script>
</body>
